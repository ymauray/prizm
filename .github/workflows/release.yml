name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build macOS Apple Silicon package
        run: |
          dotnet publish src/Prizm.App -c Release -r osx-arm64 --self-contained false -o publish-osx-arm64
          tar -czf Prizm-${{ github.ref_name }}-osx-arm64.tar.gz -C publish-osx-arm64 .

      - name: Build Linux package
        run: |
          dotnet publish src/Prizm.App -c Release -r linux-x64 --self-contained false -o publish-linux-x64
          tar -czf Prizm-${{ github.ref_name }}-linux-x64.tar.gz -C publish-linux-x64 .

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            Prizm-${{ github.ref_name }}-osx-arm64.tar.gz \
            Prizm-${{ github.ref_name }}-linux-x64.tar.gz \
            --title "Prizm ${{ github.ref_name }}" \
            --generate-notes
