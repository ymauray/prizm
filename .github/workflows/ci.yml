name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Run fast tests
        run: dotnet test -c Release --no-build --filter "Category!=Slow"

      - name: Run slow tests (ZEXDOC & ZEXALL on push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'macos-latest'
        run: dotnet test -c Release --no-build --filter "Category=Slow"
